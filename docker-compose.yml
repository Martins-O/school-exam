services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cbt_user
      POSTGRES_PASSWORD: cbt_password
      POSTGRES_DB: cbt_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbt_user -d cbt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
